- generic [active] [ref=f1e1]:
  - 'heading "Stop When the Evidence Is Enough: Sequential Evaluation for LLMs and Agents" [level=1] [ref=f1e2]'
  - paragraph [ref=f1e3]:
    - strong [ref=f1e4]: "Submission: NeurIPS 2026 Education Track — Tutorial"
    - strong [ref=f1e5]: "Duration: 2 hours (one session: 45 min instruction + 75 min guided exercises)"
  - heading "Authors" [level=2] [ref=f1e6]
  - paragraph [ref=f1e7]: Aaliyan Shaikh (independent), Ryan Anthony Marinelli (University of Oslo)
  - heading "Abstract" [level=2] [ref=f1e8]
  - paragraph [ref=f1e9]:
    - text: "Benchmarking large language models is expensive and energy-intensive, yet most of the budget is spent confirming conclusions that are already obvious after a small fraction of the data. This tutorial teaches participants how to evaluate LLMs and agents with Bayesian sequential testing: update a posterior distribution over each model's quality as every example is scored, and stop the evaluation the moment the evidence is strong enough. We use the open-source"
    - code [ref=f1e10]: bayesbench
    - text: package, which the instructors developed and which we release together with this tutorial.
  - paragraph [ref=f1e11]:
    - text: The tutorial's central theme is
    - emphasis [ref=f1e12]: calibration
    - text: ": deciding when a stopping rule is trustworthy. We show that the naive rule \"stop when P(A > B) ≥ 0.95\" is a random walk that eventually crosses its own threshold — under two provably equal models it declares a winner in 65.8% of runs at horizon 200, and even a minimum-sample guard of 100 leaves a 27.5% false-winner rate. We reproduce a published 98.7% cost-saving claim on NorEval exactly, then show that permuting item order produces wrong winners in up to 2.3% of runs — the claim was saved by enormous true gaps, not by the stopping rule. Against this, we teach two principled remedies implemented in"
    - code [ref=f1e13]: bayesbench
    - text: ": equivalence testing via a region of practical equivalence (ROPE), so \"no difference\" is a positive claim and never a consequence of too little data; and Ville-valid confidence sequences (Waudby-Smith & Ramdas, 2023), which guarantee at most α false decisions at"
    - emphasis [ref=f1e14]: any
    - text: stopping time with no calibration and no horizon assumptions. Participants learn to measure the trade-off between the two — guarantees cost samples, heuristics cost trust — with a simulation harness we ship in the package.
  - paragraph [ref=f1e15]:
    - text: "The session is fully executable: every example runs on CPU with no API keys, using deterministic synthetic solvers whose ground truth is known, so participants can directly"
    - emphasis [ref=f1e16]: judge
    - text: the stopping rules against reality. Exercises cover confidence thresholds, ROPE margins, dataset ordering, cost/reliability frontiers, and paired evaluation design. All charts and efficiency claims are reproducible from decision traces exported by the package.
