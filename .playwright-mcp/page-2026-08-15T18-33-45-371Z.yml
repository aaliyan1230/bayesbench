    - text: "| | 0 min | Buffer / discussion | |"
  - heading "Relevance to recent literature" [level=2] [ref=f1e43]
  - paragraph [ref=f1e44]:
    - text: The tutorial is positioned against an active line of work on efficient evaluation. tinyBenchmarks (Maia Polo et al., ICML 2024) shows how much signal is lost when benchmarks are truncated without principled stopping criteria. MixEval (Ni et al., NeurIPS 2024) demonstrates that evaluation sets and their orderings materially change conclusions. "How Benchmark Prediction from Fewer Data Misses the Mark" (NeurIPS 2025) documents that few-shot performance prediction remains unreliable — precisely the regime where sequential, calibration-aware stopping has the most to offer. Our statistical machinery builds on Waudby-Smith & Ramdas (2023),
    - emphasis [ref=f1e45]: Estimating means of bounded random variables by betting
    - text: ", and on the martingale foundations of Ville (1939)."
  - heading "Software release" [level=2] [ref=f1e46]
  - paragraph [ref=f1e47]:
    - code [ref=f1e48]: bayesbench
    - text: is an open-source Python package (github.com/rymarinelli/ bayesbench) with 300+ tests, a CLI, async support, and framework adapters. The tutorial ZIP includes the executed notebook, exercises and solutions, slides, synthetic datasets, and exported decision traces — everything reruns from a clean environment. An Apache-2.0 relicensing is in progress with contributor consent; the materials are original and self-contained (ZIP < 5 MB).
