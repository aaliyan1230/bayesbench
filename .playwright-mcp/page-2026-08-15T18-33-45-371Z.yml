  - heading "Learning objectives" [level=2] [ref=f1e32]
  - list [ref=f1e33]:
    - listitem [ref=f1e34]: Quantify the cost of fixed-budget evaluation and identify when sequential stopping can avoid it.
    - listitem [ref=f1e35]: Explain Bayesian posterior updating for binary (Beta–Bernoulli) and continuous (Normal–Inverse-Gamma) scores.
    - listitem [ref=f1e36]: Distinguish superiority, equivalence (ROPE), and insufficient evidence; never confuse P(A>B) ≈ 0.5 with equivalence.
    - listitem [ref=f1e37]: Calibrate a stopping rule across effect sizes, seeds, and dataset orderings, and explain the optional-stopping trap.
    - listitem [ref=f1e38]: Use confidence sequences for any-time error control (≤ α false decisions at any stopping time) and compare their sample cost to heuristic rules.
    - listitem [ref=f1e39]: Run streaming, traced, paired, and lower-is-better evaluations and export reproducible evidence for public claims.
  - heading "Session plan" [level=2] [ref=f1e40]
  - paragraph [ref=f1e41]:
    - text: "| Time | Activity | Materials | |---|---|---| | 15 min | Motivation: cost of evaluation; the NorEval 98.7% case study | Slides 1–6 | | 25 min | Posterior updating live; decision semantics and ROPE | Notebook §1–§3 | | 20 min | Calibration: optional-stopping trap, confidence sequences | Notebook §4, slides 7–10 | | 15 min | Live streaming, paired and lower-is-better evaluations | Notebook §5 | | 45 min | Guided exercises 1–6 (solutions included for self-check) |"
